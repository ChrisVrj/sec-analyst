name: EDGAR SEC Poller

# ─────────────────────────────────────────────────────────────────────────────
# GOAL: continuous coverage during the trading windows — every filing fetched,
# summarized and posted within seconds, with no gaps to fall through.
#
# HOW THE THREE PIECES FIT TOGETHER
#
# 1. cron '*/5 * * * *' — fires every 5 minutes, 24/7.
#    NOT because we want a run every 5 minutes, but because GitHub throttles
#    scheduled workflows on repos its scheduler considers low-activity. A
#    single high-frequency cron keeps the workflow "hot" so the cadence is
#    honoured. Narrow window-shaped crons were tried and got skipped for
#    1-2 hours at a stretch. Do not "optimize" this back to targeted crons.
#
# 2. concurrency (cancel-in-progress: false) — GitHub allows at most one
#    RUNNING plus one PENDING run per group; each new trigger replaces the
#    pending one. That gives two things for free:
#      · the */5 ticks during a window can't pile up or double-post
#      · a pending run is always parked, so if the long run dies the
#        replacement starts within seconds of the failure, not 5 minutes
#
#    EXPECTED SIDE EFFECT: while a long run is live, each */5 tick replaces
#    the parked pending run, so the Actions tab fills with "cancelled" runs
#    that never executed a step — roughly 60 per day window. This is the
#    mechanism working, not a fault. The run that matters is the single
#    long-lived one; sort by duration to find it.
#
# 3. The job runs ONE LONG LOOP to the end of the current window rather than
#    a fixed 4 minutes. GitHub's job ceiling is 6h; the longest window is 5h.
#    This is what removes the inter-run gaps entirely — previously every run
#    boundary cost ~30s of blindness, plus GitHub's scheduling jitter.
#
# TRADING WINDOWS (Sofia local — tzdata handles EEST/EET, nothing to edit
# at the DST switch):
#   Day   : 13:00 – 18:00   Mon–Fri   = 06:00 – 11:00 ET
#   Night : 23:00 – 03:00   Mon–Fri evenings = 16:00 – 20:00 ET
#                                     (runs into the next calendar day)
#
# Both windows sit entirely inside EDGAR's filing hours (06:00–22:00 ET), so
# no cycle is wasted. The day window opens at 13:00 Sofia precisely because
# that is 06:00 ET — EDGAR's first filing minute — in both aligned DST
# regimes. It was 11:00–16:00 until Aug 2026, which spent its first two hours
# polling a system that was not yet accepting filings.
#
# During the 2–3 weeks each spring/autumn when US and EU clocks are out of
# step, Sofia 13:00 lands on 07:00 ET instead of 06:00 — still live, just an
# hour later. Not worth compensating for.
#
# COST: public repo = unlimited Actions minutes. ~9h/weekday of runtime is
# free. SEC sees ~1 feed request per 15s (0.07 req/s against their 10 req/s
# limit). NVIDIA sees at most 30 req/min against a ~40 req/min free ceiling.
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    - cron: '*/5 * * * *'   # keeps the scheduler warm; window check does the real gating
  workflow_dispatch:         # manual trigger — bypasses the window, capped at 10 min

concurrency:
  group: edgar-poller
  cancel-in-progress: false  # never kill a live poller; queue one replacement behind it

jobs:
  poll-and-dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 320     # longest window is 5h; GitHub's hard ceiling is 6h

    steps:
      # ── 1. Which window are we in, and how long should this job live? ─────
      - name: Check trading window
        id: window
        run: |
          # Everything is computed in Sofia local time, so EEST/EET is handled
          # by tzdata. This replaced four UTC constants that had to be
          # hand-edited on the last Sunday of March and October.
          read -r SOFIA_H SOFIA_M SOFIA_DOW <<< "$(TZ=Europe/Sofia date +'%-H %-M %u')"
          SOFIA_MIN=$(( SOFIA_H * 60 + SOFIA_M ))
          SOFIA_OFFSET=$(TZ=Europe/Sofia date +%z)

          echo "Sofia $(TZ=Europe/Sofia date '+%H:%M %a') (UTC$SOFIA_OFFSET)  dow=$SOFIA_DOW  min=$SOFIA_MIN"

          # Guard: if the runner ever loses tzdata, TZ= silently yields UTC and
          # every window would shift 2-3 hours. Make that loud, not silent.
          case "$SOFIA_OFFSET" in
            +0300|+0200) ;;
            *) echo "::warning title=Sofia timezone lookup failed::Offset '$SOFIA_OFFSET' is neither +0300 nor +0200 — tzdata missing? Window boundaries are unreliable." ;;
          esac

          # Window bounds in Sofia minutes-past-midnight.
          DAY_START=780     # 13:00 Sofia = 06:00 ET, EDGAR's first filing minute
          DAY_END=1080      # 18:00 Sofia = 11:00 ET
          NIGHT_START=1380  # 23:00 Sofia = 16:00 ET
          NIGHT_END=180     # 03:00 Sofia = 20:00 ET, the following day

          PROCEED=false
          WINDOW="none"
          END_MIN=0

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            # Manual test: run regardless of the clock, but only briefly — a
            # manual run must not hold the concurrency slot for five hours.
            WINDOW="manual"
            PROCEED=true
            END_MIN=$(( SOFIA_MIN + 10 ))

          elif [ "$SOFIA_DOW" -le 5 ] && [ "$SOFIA_MIN" -ge "$DAY_START" ] && [ "$SOFIA_MIN" -lt "$DAY_END" ]; then
            WINDOW="day 13:00-18:00"
            PROCEED=true
            END_MIN=$DAY_END

          elif [ "$SOFIA_DOW" -le 5 ] && [ "$SOFIA_MIN" -ge "$NIGHT_START" ]; then
            # Evening half of the night window. Run straight through midnight
            # to 03:00 so the session is covered by a single job: 1440 + 180.
            WINDOW="night 23:00-03:00"
            PROCEED=true
            END_MIN=$(( 1440 + NIGHT_END ))

          elif [ "$SOFIA_DOW" -ge 2 ] && [ "$SOFIA_DOW" -le 6 ] && [ "$SOFIA_MIN" -lt "$NIGHT_END" ]; then
            # After-midnight half. Valid Tue–Sat because it belongs to the
            # PRECEDING weekday's evening — Sat 00:00-03:00 is Friday's US
            # after-hours session and is wanted; Mon 00:00-03:00 is Sunday's
            # and is not.
            WINDOW="night 23:00-03:00 (past midnight)"
            PROCEED=true
            END_MIN=$NIGHT_END

          else
            echo "Outside trading windows — skipping."
          fi

          RUN_SECONDS=0
          if [ "$PROCEED" = "true" ]; then
            RUN_SECONDS=$(( (END_MIN - SOFIA_MIN) * 60 ))
            # Clamp: never negative (clock races at a boundary), never beyond
            # the job timeout.
            [ "$RUN_SECONDS" -lt 60 ] && RUN_SECONDS=60
            [ "$RUN_SECONDS" -gt 18600 ] && RUN_SECONDS=18600
            echo "Window: $WINDOW — looping for ${RUN_SECONDS}s (until Sofia $(( END_MIN / 60 % 24 )):$(printf '%02d' $(( END_MIN % 60 ))))"
          fi

          {
            echo "proceed=$PROCEED"
            echo "run_seconds=$RUN_SECONDS"
            echo "window=$WINDOW"
          } >> "$GITHUB_OUTPUT"

      # ── 2. Checkout ────────────────────────────────────────────────────────
      - name: Checkout
        if: steps.window.outputs.proceed == 'true'
        uses: actions/checkout@v4

      # ── 3. Python ──────────────────────────────────────────────────────────
      - name: Set up Python
        if: steps.window.outputs.proceed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ── 4. Restore caches ──────────────────────────────────────────────────
      #  NOTE: actions/cache only writes in its post-job step, so with a
      #  window-length job this state is persisted once, at the end. If the job
      #  is killed mid-window the state is lost — but the blast radius is
      #  bounded, because the poller only ever sees EDGAR's last-100-filings
      #  feed, so at worst a couple of recent filings get re-posted.
      - name: Restore seen accessions cache
        if: steps.window.outputs.proceed == 'true'
        uses: actions/cache@v4
        with:
          path: seen_accessions.json
          key: seen-accessions-${{ github.run_id }}
          restore-keys: |
            seen-accessions-

      - name: Restore dispatched accessions cache
        if: steps.window.outputs.proceed == 'true'
        uses: actions/cache@v4
        with:
          path: dispatched_accessions.json
          key: dispatched-accessions-${{ github.run_id }}
          restore-keys: |
            dispatched-accessions-

      # ── 5. Poll + dispatch, continuously, until the window closes ──────────
      - name: Poll and dispatch loop
        if: steps.window.outputs.proceed == 'true'
        run: |
          POLL_SECONDS=15
          END_TIME=$(( $(date +%s) + ${{ steps.window.outputs.run_seconds }} ))
          POLL=0
          POSTED=0

          echo "Window '${{ steps.window.outputs.window }}' — polling every ${POLL_SECONDS}s until $(date -u -d "@$END_TIME" '+%H:%M:%S UTC')"

          while [ "$(date +%s)" -lt "$END_TIME" ]; do
            POLL=$(( POLL + 1 ))

            python edgar_poller.py --once

            COUNT=$(find filings-inbox -maxdepth 1 -name '*.json' 2>/dev/null | wc -l)
            if [ "$COUNT" -gt 0 ]; then
              echo "──── Poll #$POLL: $COUNT filing(s) queued, dispatching ────"
              python openrouter_dispatch.py
              POSTED=$(( POSTED + COUNT ))
            fi

            REMAINING=$(( END_TIME - $(date +%s) ))
            if [ "$REMAINING" -le 0 ]; then
              break
            elif [ "$REMAINING" -gt "$POLL_SECONDS" ]; then
              sleep "$POLL_SECONDS"
            else
              sleep "$REMAINING"
            fi
          done

          echo "Window closed after $POLL poll(s); $POSTED filing(s) entered the dispatcher."
        env:
          GITHUB_WORKSPACE:   ${{ github.workspace }}
          DISCORD_WEBHOOK:    ${{ secrets.DISCORD_WEBHOOK }}
          # Optional priority routing. With DISCORD_WEBHOOK_URGENT set,
          # redemptions / listings / M&A / tender offers go to that channel
          # INSTEAD of the main one, so it stays pure signal and can carry
          # push notifications. DISCORD_URGENT_MENTION (e.g. "@here" or
          # "<@&ROLE_ID>") pings on those posts. Both unset = previous
          # behaviour, everything in one channel with no pings.
          DISCORD_WEBHOOK_URGENT: ${{ secrets.DISCORD_WEBHOOK_URGENT }}
          DISCORD_URGENT_MENTION: ${{ vars.DISCORD_URGENT_MENTION }}
          # Primary provider: NVIDIA NIM (build.nvidia.com). ~40 req/min free,
          # no daily cap. Key expires ~6 months after issue — regenerate at
          # build.nvidia.com/settings/api-keys.
          NVIDIA_API_KEY:     ${{ secrets.NVIDIA_API_KEY }}
          # Fallback provider. Delete this secret to disable OpenRouter
          # entirely — the dispatcher drops providers with no key.
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Optional comma-separated overrides for either chain; defaults live
          # in openrouter_dispatch.py.
          NVIDIA_MODELS:      ${{ vars.NVIDIA_MODELS }}
          OPENROUTER_MODEL:   ${{ vars.OPENROUTER_MODEL }}

      # ── 6. Upload logs (always, even on failure) ───────────────────────────
      - name: Upload logs
        if: steps.window.outputs.proceed == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ github.run_id }}
          path: |
            edgar_poller.log
            dispatch.log
          retention-days: 7
