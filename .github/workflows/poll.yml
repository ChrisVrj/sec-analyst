name: EDGAR SEC Poller

# ─────────────────────────────────────────────────────────────────────────────
# WHY */5 * * * * instead of targeted crons?
#
# GitHub throttles scheduled workflows on low-activity repos, causing runs to
# fire every 1-2 hours instead of every 5 minutes. A single high-frequency
# cron keeps the workflow "hot" so GitHub honours the cadence reliably.
#
# The time-window check is done in bash (step 1). All subsequent steps carry
# an  if: steps.window.outputs.proceed == 'true'  guard so they are skipped
# instantly when the job fires outside the Sofia trading windows.
#
# Trading windows (Sofia local time):
#   Window 1 : 11:00 AM – 04:30 PM
#   Window 2 : 11:00 PM – 01:30 AM (next day)
#
# UTC equivalents (EEST = UTC+3, summer):
#   Window 1 : 08:00 – 13:30 UTC  →  480 – 810  min
#   Window 2 : 20:00 – 22:30 UTC  → 1200 – 1350 min
#
# ⚠ When clocks go back to EET (UTC+2, late Oct – late Mar):
#   Set W1_START=540 W1_END=870 W2_START=1260 W2_END=1410
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    - cron: '*/5 * * * *'   # every 5 min 24/7 — window check below keeps it clean
  workflow_dispatch:         # manual trigger for testing

jobs:
  poll-and-dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # ── 1. Check trading window ────────────────────────────────────────────
      - name: Check trading window
        id: window
        run: |
          HOUR_UTC=$(date -u +%-H)
          MIN_UTC=$(date -u  +%-M)
          TIME_UTC=$(( HOUR_UTC * 60 + MIN_UTC ))
          DOW=$(date -u +%u)   # 1=Mon … 7=Sun

          echo "UTC $(date -u '+%H:%M')  DOW=$DOW  min=$TIME_UTC"

          PROCEED=false

          if [ "$DOW" -lt 6 ]; then
            # ── EEST (UTC+3) ──────────────────────────────────────────────
            W1_START=480    # 08:00 UTC = 11:00 Sofia
            W1_END=810      # 13:30 UTC = 16:30 Sofia
            W2_START=1200   # 20:00 UTC = 23:00 Sofia
            W2_END=1350     # 22:30 UTC = 01:30 Sofia (+1)

            if   [ "$TIME_UTC" -ge "$W1_START" ] && [ "$TIME_UTC" -lt "$W1_END" ]; then
              echo "Window 1 — proceeding."
              PROCEED=true
            elif [ "$TIME_UTC" -ge "$W2_START" ] && [ "$TIME_UTC" -lt "$W2_END" ]; then
              echo "Window 2 — proceeding."
              PROCEED=true
            else
              echo "Outside windows — skipping."
            fi
          else
            echo "Weekend — skipping."
          fi

          echo "proceed=$PROCEED" >> "$GITHUB_OUTPUT"

      # ── 2. Checkout ────────────────────────────────────────────────────────
      - name: Checkout
        if: steps.window.outputs.proceed == 'true'
        uses: actions/checkout@v4

      # ── 3. Python ──────────────────────────────────────────────────────────
      - name: Set up Python
        if: steps.window.outputs.proceed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ── 4. Restore caches ──────────────────────────────────────────────────
      - name: Restore seen accessions cache
        if: steps.window.outputs.proceed == 'true'
        uses: actions/cache@v4
        with:
          path: seen_accessions.json
          key: seen-accessions-${{ github.run_id }}
          restore-keys: |
            seen-accessions-

      - name: Restore dispatched accessions cache
        if: steps.window.outputs.proceed == 'true'
        uses: actions/cache@v4
        with:
          path: dispatched_accessions.json
          key: dispatched-accessions-${{ github.run_id }}
          restore-keys: |
            dispatched-accessions-

      # ── 5. Poll + dispatch loop (runs for ~4 min, polls every 30 s) ────────
      - name: Poll and dispatch loop
        if: steps.window.outputs.proceed == 'true'
        run: |
          END_TIME=$(( $(date +%s) + 240 ))
          POLL=0

          while [ $(date +%s) -lt $END_TIME ]; do
            POLL=$(( POLL + 1 ))
            echo "──── Poll #$POLL at $(date -u '+%H:%M:%S UTC') ────"

            python edgar_poller.py --once

            COUNT=$(find filings-inbox -maxdepth 1 -name '*.json' 2>/dev/null | wc -l)
            echo "Inbox: $COUNT filing(s)"

            if [ "$COUNT" -gt "0" ]; then
              python openrouter_dispatch.py
            fi

            REMAINING=$(( END_TIME - $(date +%s) ))
            if [ $REMAINING -gt 30 ]; then
              sleep 30
            elif [ $REMAINING -gt 5 ]; then
              sleep 5
            else
              break
            fi
          done

          echo "Loop complete after $POLL poll(s)."
        env:
          GITHUB_WORKSPACE:   ${{ github.workspace }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DISCORD_WEBHOOK:    ${{ secrets.DISCORD_WEBHOOK }}
          OPENROUTER_MODEL:   ${{ vars.OPENROUTER_MODEL || 'meta-llama/llama-3.3-70b-instruct:free' }}

      # ── 6. Upload logs (always, even on failure) ───────────────────────────
      - name: Upload logs
        if: steps.window.outputs.proceed == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ github.run_id }}
          path: |
            edgar_poller.log
            dispatch.log
          retention-days: 7
