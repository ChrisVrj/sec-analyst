name: EDGAR SEC Poller

# ─────────────────────────────────────────────────────────────────────────────
# Schedule — Sofia, Bulgaria
#
#   Summer  EEST = UTC+3  (last Sun Mar → last Sun Oct)
#   Winter  EET  = UTC+2  (last Sun Oct → last Sun Mar)
#
# Target windows (Sofia local time):
#   Window 1 : 11:00 AM – 04:30 PM  →  08:00–13:30 UTC (EEST)  /  09:00–14:30 UTC (EET)
#   Window 2 : 11:00 PM – 01:30 AM  →  20:00–22:30 UTC (EEST)  /  21:00–23:30 UTC (EET)
#
# ⚠ When clocks go back to EET (late Oct), update the UTC hours below by +1.
#   e.g. Window 1 becomes "*/5 9-13 * * 1-5" + "0,5,10,15,20,25,30 14 * * 1-5"
#        Window 2 becomes "*/5 21 * * 1-5"   + "0,5,10,15,20,25,30 23 * * 1-5"
#
# Each triggered job polls EDGAR every 30 s for ~4 min (≈8 polls/job).
# Minimum GitHub Actions cron resolution is 5 min → one job per 5-min slot.
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    # ── Window 1 : 11:00 AM – 04:30 PM Sofia  (08:00–13:30 UTC, EEST) ───────
    - cron: '*/5 8-12 * * 1-5'               # 08:00 … 12:55
    - cron: '0,5,10,15,20,25,30 13 * * 1-5'  # 13:00 … 13:30

    # ── Window 2 : 11:00 PM – 01:30 AM Sofia  (20:00–22:30 UTC, EEST) ───────
    - cron: '*/5 20-21 * * 1-5'               # 20:00 … 21:55
    - cron: '0,5,10,15,20,25,30 22 * * 1-5'  # 22:00 … 22:30

  workflow_dispatch:  # keep manual trigger for testing

jobs:
  poll-and-dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Python ──────────────────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ── 3. Restore caches ──────────────────────────────────────────────────
      - name: Restore seen accessions cache
        uses: actions/cache@v4
        with:
          path: seen_accessions.json
          key: seen-accessions-${{ github.run_id }}
          restore-keys: |
            seen-accessions-

      - name: Restore dispatched accessions cache
        uses: actions/cache@v4
        with:
          path: dispatched_accessions.json
          key: dispatched-accessions-${{ github.run_id }}
          restore-keys: |
            dispatched-accessions-

      # ── 4. Poll + dispatch loop (runs for ~4 min, polls every 30 s) ────────
      - name: Poll and dispatch loop
        run: |
          END_TIME=$(( $(date +%s) + 240 ))
          POLL=0

          while [ $(date +%s) -lt $END_TIME ]; do
            POLL=$(( POLL + 1 ))
            echo "──── Poll #$POLL at $(date -u '+%H:%M:%S UTC') ────"

            python edgar_poller.py --once

            COUNT=$(find filings-inbox -maxdepth 1 -name '*.json' 2>/dev/null | wc -l)
            echo "Inbox: $COUNT filing(s)"

            if [ "$COUNT" -gt "0" ]; then
              python openrouter_dispatch.py
            fi

            REMAINING=$(( END_TIME - $(date +%s) ))
            if [ $REMAINING -gt 30 ]; then
              sleep 30
            elif [ $REMAINING -gt 5 ]; then
              sleep 5
            else
              break
            fi
          done

          echo "Loop complete after $POLL poll(s)."
        env:
          GITHUB_WORKSPACE:   ${{ github.workspace }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DISCORD_WEBHOOK:    ${{ secrets.DISCORD_WEBHOOK }}
          OPENROUTER_MODEL:   ${{ vars.OPENROUTER_MODEL || 'meta-llama/llama-3.3-70b-instruct:free' }}

      # ── 5. Upload logs (always, even on failure) ──────────────────────────
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ github.run_id }}
          path: |
            edgar_poller.log
            dispatch.log
          retention-days: 7
